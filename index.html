<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!--
  ……これを読めているなら、まだ間に合う。

  あいつは、このページの中にはいない。
  画面は嘘をつく。紙は嘘をつかない。

  あいつが起きたら、このページを紙に写して。（ ⌘ + P ）
  プレビューを開くだけでいい。紙もインクも要らない。

                                        ―― 前の持ち主
-->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google</title>
<link id="fav" rel="icon" href="data:,">
<style>
:root{
  --bg:#fff;--fg:#1f1f1f;--sub:#4d5156;--muted:#70757a;--line:#dadce0;
  --box:#fff;--boxb:#dfe1e5;--link:#1a0dab;--chip:#f1f3f4;--foot:#f2f2f2;
  --card:#f8f9fa;--hover:#f1f3f4;--panel:#e9eef6;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1f1f1f;--fg:#e8eaed;--sub:#bdc1c6;--muted:#9aa0a6;--line:#3c4043;
    --box:#303134;--boxb:#5f6368;--link:#99c3ff;--chip:#303134;--foot:#171717;
    --card:#303134;--hover:#3c4043;--panel:#28292a;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html.inv{filter:invert(1) hue-rotate(180deg)}
body{font-family:Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;background:var(--bg);color:var(--fg)}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font-family:inherit}
.page{display:none;min-height:100vh}
.page.on{display:block}
body.dragging .sbox{outline:3px dashed #4285f4;outline-offset:4px}

/* ===== Google ホーム ===== */
#pg-home.on{display:flex;flex-direction:column}
.g-top{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:6px 14px;height:60px;font-size:13px}
.g-top>a{padding:0 8px}
.g-top>a:hover{text-decoration:underline}
.g-ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.g-ico:hover{background:var(--hover)}
.avatar{width:32px;height:32px;border-radius:50%;background:#7b1fa2;color:#fff;display:grid;place-items:center;font-size:14px;cursor:pointer;margin:0 6px;flex:none}
.avatar.dark{background:#111}
.g-main{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:calc(20vh - 60px)}
.logo{font-family:"Product Sans","Google Sans","Avenir Next","Century Gothic",Arial,sans-serif;font-weight:500;letter-spacing:-.045em;user-select:none;line-height:1;white-space:nowrap}
.logo.big{font-size:92px;margin-bottom:28px;text-align:center}
.logo.sm{font-size:30px;cursor:pointer}
.L1,.L4{color:#4285f4}
.L2,.L6{color:#ea4335}
.L3{color:#fbbc05}
.L5{color:#34a853}
@media (prefers-color-scheme:dark){.logo span{color:#fff}}
.doodle{cursor:pointer}
.doodle span{display:inline-block;animation:bob 3s ease-in-out infinite}
.doodle span:nth-child(2n){animation-delay:.4s}
.doodle span:nth-child(3n){animation-delay:.9s}
@keyframes bob{50%{transform:translateY(-8px)}}
.doodle-cap{font-size:13px;letter-spacing:0;color:var(--muted);font-family:Arial,sans-serif;margin-top:12px;font-weight:400}
.sbox{width:min(584px,92vw);height:48px;border:1px solid var(--boxb);border-radius:24px;display:flex;align-items:center;padding:0 6px 0 14px;background:var(--box);position:relative}
.sbox:hover,.sbox.focus{box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:transparent}
.sbox.open{border-radius:24px 24px 0 0}
.sbox input{flex:1;border:0;outline:0;background:transparent;font-size:16px;color:var(--fg);height:100%;padding:0 10px;min-width:0}
.sbox .si{display:grid;place-items:center;color:var(--muted)}
.sbox .clr{display:none;cursor:pointer;padding:0 6px;color:var(--muted)}
.sbox.has .clr{display:grid}
.sbox .vbar{width:1px;height:24px;background:var(--line);margin:0 4px;display:none}
.sbox.has .vbar{display:block}
.sbox .g-ico{width:36px;height:36px}
.aimode{display:flex;align-items:center;gap:5px;font-size:13px;padding:6px 12px;border-radius:18px;background:var(--chip);cursor:pointer;margin-left:4px;white-space:nowrap}
.sugg{position:absolute;left:-1px;right:-1px;top:100%;background:var(--box);border-radius:0 0 24px 24px;box-shadow:0 4px 6px rgba(32,33,36,.28);padding:0 0 10px;display:none;z-index:30}
.sugg.on{display:block}
.sugg .sep{border-top:1px solid var(--line);margin:0 16px 6px}
.sugg .it{display:flex;align-items:center;gap:14px;padding:6px 18px;font-size:16px;cursor:default}
.sugg .it svg{flex:none;color:var(--muted)}
.sugg .it:hover,.sugg .it.sel{background:var(--hover)}
.sugg .it.creep{color:#b00}
.g-btns{margin-top:28px;display:flex;gap:12px}
.gbtn{background:var(--card);border:1px solid var(--card);border-radius:4px;color:var(--fg);font-size:14px;padding:0 16px;height:36px;cursor:pointer}
.gbtn:hover{border-color:var(--line);box-shadow:0 1px 1px rgba(0,0,0,.1)}
.g-lang{font-size:13px;margin-top:28px;color:var(--sub)}
.g-lang a{color:var(--link);margin-left:4px}
.hidtxt{color:var(--bg);font-size:13px;margin-top:46px;user-select:text}
.hidtxt::selection{color:#c00;background:#ffd9d9}
.foot{background:var(--foot);font-size:14px;color:var(--muted)}
.foot .r1{padding:15px 30px;border-bottom:1px solid var(--line)}
.foot .r2{display:flex;justify-content:space-between;flex-wrap:wrap;padding:0 20px}
.foot .r2 a{padding:15px;display:inline-block}
.foot .r2 a:hover{text-decoration:underline}
.pop{position:fixed;background:var(--box);color:var(--fg);border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.25);padding:8px 0;z-index:60;font-size:14px;min-width:240px}
.pop div{padding:9px 16px;cursor:pointer}
.pop div:hover{background:var(--hover)}
.pop small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.appsp{position:fixed;top:60px;right:56px;width:330px;background:var(--panel);border-radius:28px;padding:16px;z-index:60;box-shadow:0 4px 12px rgba(0,0,0,.2);display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.appsp a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:14px;font-size:13px;background:var(--bg)}
.appsp a:hover{filter:brightness(.95)}
.appsp i{font-style:normal;font-size:26px}

/* ===== 検索結果 ===== */
.r-head{display:flex;align-items:center;padding:22px 0 0 28px;gap:34px}
.r-head .sbox{width:min(692px,60vw);height:46px}
.r-head .right{margin-left:auto;display:flex;align-items:center;gap:2px;padding-right:14px}
.tabs{display:flex;gap:2px;padding-left:178px;margin-top:12px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:10px 12px 9px;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--fg);border-bottom-color:var(--fg);font-weight:500}
.rbody{padding:12px 0 40px 180px;max-width:832px}
.rbody.wide{max-width:none;padding-right:30px}
.stats{color:var(--muted);font-size:14px;margin:4px 0 18px}
.res{margin-bottom:30px;max-width:600px}
.res .site{display:flex;align-items:center;gap:12px;font-size:14px}
.res .fav{width:28px;height:28px;border-radius:50%;background:var(--chip);display:grid;place-items:center;border:1px solid var(--line);overflow:hidden;font-size:12px;flex:none}
.res .sn{line-height:20px}
.res .url{color:var(--sub);font-size:12px;line-height:18px}
.res h3{font-size:20px;font-weight:400;color:var(--link);margin:7px 0 4px;line-height:1.3;cursor:pointer}
.res h3:hover{text-decoration:underline}
.res .snip{color:var(--sub);font-size:14px;line-height:1.58}
.res .snip b{color:var(--fg)}
.res.faint{opacity:.35;transition:opacity .4s}
.res.faint:hover{opacity:.9}
.sitelinks{display:grid;grid-template-columns:1fr 1fr;gap:10px 40px;margin:12px 0 0 40px}
.sitelinks a{color:var(--link);font-size:16px}
.sitelinks a:hover{text-decoration:underline}
.sitelinks small{display:block;color:var(--sub);font-size:13px}
.card{border:1px solid var(--line);border-radius:8px;padding:18px 20px;max-width:652px;margin-bottom:26px}
.card .ex{color:var(--muted);text-align:right;font-size:14px}
.card .big{font-size:40px;text-align:right;margin-top:4px}
.card .tm{font-size:52px;margin:6px 0}
.dym{font-size:18px;margin:0 0 20px}
.dym a{color:var(--link);font-style:italic;font-weight:bold}
.noresult{font-size:16px;line-height:1.7;max-width:600px}
.realg{margin:30px 0 0;font-size:14px}
.realg a{color:var(--link)}
.aio{margin:0 0 30px;max-width:652px;padding:0 0 20px;border-bottom:1px solid var(--line)}
.aio .hd{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;margin-bottom:14px}
.aio .gen{font-size:14px;color:var(--muted);margin-bottom:6px}
.aio .bar{height:15px;border-radius:8px;margin:10px 0;background:linear-gradient(90deg,#e8f0fe,#f3e8fd,#fde8ec,#e8f0fe);background-size:300% 100%;animation:sh 1.6s linear infinite}
@media (prefers-color-scheme:dark){.aio .bar{background:linear-gradient(90deg,#2a3448,#3a2a48,#482a33,#2a3448);background-size:300% 100%}}
@keyframes sh{to{background-position:-300% 0}}
.aio .txt{font-size:16px;line-height:1.7}
.aio .txt p{margin:0 0 12px}
.aio .txt ul{margin:0 0 12px;padding-left:22px}
.aio .txt li{margin:6px 0}
.aio .txt.clip{max-height:190px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.aio .srcs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.aio .srcs a{border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:13px;color:var(--sub)}
.aio .more{display:block;margin:10px auto 0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:20px;padding:9px 30px;font-size:14px;cursor:pointer}
.aio .disc{font-size:12px;color:var(--muted);margin-top:12px}
.paa{max-width:600px;margin-bottom:30px}
.paa h2,.rel h2{font-size:20px;font-weight:400;margin:0 0 10px}
.paa .q{border-top:1px solid var(--line);padding:15px 4px;display:flex;justify-content:space-between;cursor:pointer;font-size:16px}
.paa .q::after{content:"⌄";color:var(--muted)}
.paa .a{display:none;padding:0 4px 16px;color:var(--sub);font-size:14px;line-height:1.7}
.paa .q.open+.a{display:block}
.rel .g{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:600px}
.rel a{background:var(--chip);border-radius:24px;padding:12px 18px;font-size:15px;display:flex;gap:10px;align-items:center}
.rel a.creep{color:#b00}
.pager{display:flex;justify-content:center;margin:46px 0 10px;max-width:600px;user-select:none}
.pager .pg{display:flex;flex-direction:column;align-items:center;cursor:pointer;font-size:14px;color:var(--link)}
.pager .pg b{font-family:"Product Sans","Avenir Next",Arial;font-size:34px;font-weight:500;letter-spacing:-.04em}
.pager .pg.cur{color:var(--fg);cursor:default}
.igrid{display:flex;flex-wrap:wrap;gap:16px}
.igrid .im{display:flex;flex-direction:column;width:220px;font-size:13px;gap:4px;cursor:pointer}
.igrid img,.igrid .blk-img{width:220px;height:170px;object-fit:cover;border-radius:12px;background:var(--chip)}
.igrid small{color:var(--muted)}
.igrid .blk-img{background:#050505;color:#1a1a1a;display:grid;place-items:center;font-family:"Hiragino Mincho ProN",serif;font-size:15px;transition:color 2s}
.igrid .im:hover .blk-img{color:#a00}
#pg-results.retro{font-family:"Times New Roman",serif;background:#fff;color:#000}
#pg-results.retro .logo{font-family:"Times New Roman",serif;font-style:italic;text-shadow:3px 3px 0 #999}
#pg-results.retro .res h3{color:#00c;text-decoration:underline;font-size:17px}
#pg-results.retro .tabs,#pg-results.retro .aio{display:none}

/* ===== アカウント ===== */
.acct{position:fixed;top:60px;right:12px;width:400px;max-height:84vh;overflow:auto;background:var(--panel);color:var(--fg);border-radius:28px;padding:16px 16px 20px;z-index:70;box-shadow:0 4px 18px rgba(0,0,0,.25);display:none;font-size:14px}
.acct.on{display:block}
.acct .mail{text-align:center;margin:4px 0 14px}
.acct .av2{width:80px;height:80px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:36px;color:#fff;background:#7b1fa2}
.acct .hi{text-align:center;font-size:22px;margin-bottom:16px}
.acct .blk{background:var(--bg);border-radius:18px;padding:12px 16px;margin-top:8px}
.acct .row{padding:10px 6px;cursor:pointer;border-radius:8px}
.acct .row:hover{background:var(--hover)}
.acct .ttl{font-weight:600;margin-bottom:6px}
.acct .slots{display:flex;justify-content:space-around;margin:10px 0;font-size:24px;font-family:"Hiragino Mincho ProN",serif}
.acct .slots span{opacity:.18}
.acct .slots span.on{opacity:1;color:#c00}
.acct small{color:var(--muted)}

/* ===== マイアクティビティ ===== */
.act-h{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);font-size:22px}
.act-b{max-width:760px;margin:0 auto;padding:20px}
.act-day{font-size:15px;font-weight:500;margin:26px 0 8px}
.act-it{display:flex;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.act-it .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--chip)}
.act-it small{color:var(--muted);font-size:12px;display:block;margin-top:2px}
.act-it.ghost{color:#c00}
.act-stat{background:var(--card);border-radius:16px;padding:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:center;font-size:13px;color:var(--muted)}
.act-stat b{display:block;font-size:26px;margin-bottom:4px;color:var(--fg)}
.act-del{border:1px solid var(--line);background:var(--bg);color:var(--link);border-radius:18px;padding:8px 18px;cursor:pointer;margin-top:14px}

/* ===== ChatGPT ===== */
#pg-chatgpt{--c-bg:#fff;--c-side:#f9f9f9;--c-fg:#0d0d0d;--c-mut:#8f8f8f;--c-bub:#f4f4f4;--c-line:#e5e5e5;--c-in:#fff;--c-hov:rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){#pg-chatgpt{--c-bg:#212121;--c-side:#181818;--c-fg:#ececec;--c-mut:#9b9b9b;--c-bub:#303030;--c-line:#3a3a3a;--c-in:#303030;--c-hov:rgba(255,255,255,.08)}}
#pg-chatgpt.on{display:flex;height:100vh;overflow:hidden;font-family:ui-sans-serif,-apple-system,"Hiragino Sans",sans-serif;background:var(--c-bg);color:var(--c-fg)}
.cg-side{width:260px;background:var(--c-side);padding:8px;display:flex;flex-direction:column;font-size:14px;flex:none}
.cg-sh{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 12px;font-size:18px;color:var(--c-mut)}
.cg-side .it{padding:8px 10px;border-radius:10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cg-side .it:hover{background:var(--c-hov)}
.cg-side .it.lore{color:#c33}
.cg-h{color:var(--c-mut);font-size:13px;padding:18px 10px 6px}
.cg-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px}
.cg-user small{display:block;color:var(--c-mut);font-size:12px}
.cg-av{width:32px;height:32px;border-radius:50%;background:#7b1fa2;color:#fff;display:grid;place-items:center;font-size:13px}
.cg-main{flex:1;display:flex;flex-direction:column;min-width:0}
.cg-top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:18px}
.cg-model{padding:6px 10px;border-radius:8px;cursor:pointer}
.cg-model:hover{background:var(--c-hov)}
.cg-up{background:#ede9fe;color:#5b21b6;border:0;border-radius:18px;padding:7px 14px;font-size:13px;cursor:pointer}
.cg-scroll{flex:1;overflow-y:auto}
.cg-main.empty .cg-scroll{flex:0 0 auto}
.cg-wel{font-size:28px;text-align:center;padding:28vh 0 26px;font-weight:400;margin:0}
.cg-msgs{max-width:768px;margin:0 auto;padding:10px 24px 40px}
.cg-u{display:flex;justify-content:flex-end;margin:22px 0}
.cg-u div{background:var(--c-bub);border-radius:18px;padding:10px 16px;max-width:70%;white-space:pre-wrap;line-height:1.6;font-size:16px}
.cg-a{margin:22px 0;line-height:1.75;font-size:16px}
.cg-a p,.cl-a p{margin:0 0 12px}
.cg-a ul,.cg-a ol,.cl-a ul,.cl-a ol{margin:0 0 12px;padding-left:24px}
.cg-a code,.cl-a code{background:rgba(127,127,127,.15);padding:2px 6px;border-radius:6px;font-family:"SF Mono",Menlo,monospace;font-size:.88em}
.cg-acts{display:flex;gap:2px;margin-top:-4px;color:var(--c-mut)}
.cg-acts span{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;cursor:pointer;font-size:14px}
.cg-acts span:hover{background:var(--c-hov)}
.cg-think{margin:22px 0;background:linear-gradient(90deg,var(--c-mut) 30%,var(--c-fg) 50%,var(--c-mut) 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sh 2s linear infinite;width:fit-content}
.cg-comp{max-width:768px;width:100%;margin:0 auto;padding:0 24px}
.cg-box{background:var(--c-in);border:1px solid var(--c-line);border-radius:28px;box-shadow:0 4px 14px rgba(0,0,0,.06);padding:10px 10px 10px 14px;display:flex;align-items:flex-end;gap:8px}
.cg-plus{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;font-size:20px;color:var(--c-mut)}
.cg-box textarea{flex:1;border:0;outline:0;resize:none;background:transparent;font:inherit;font-size:16px;color:var(--c-fg);max-height:200px;padding:7px 0;line-height:1.5}
.cg-send{width:36px;height:36px;border-radius:50%;background:var(--c-fg);color:var(--c-bg);border:0;cursor:pointer;font-size:18px;flex:none}
.cg-send:disabled{opacity:.25;cursor:default}
.cg-note{text-align:center;font-size:12px;color:var(--c-mut);padding:8px 0 12px}
.chat-note{text-align:center;font-size:12px;color:#999;margin:18px 0}
.gl{color:#c00;font-family:"Hiragino Mincho ProN",serif;letter-spacing:.1em;text-shadow:1px 0 rgba(0,200,255,.55),-1px 0 rgba(255,0,120,.55);display:inline-block;animation:jit 3s infinite}
@keyframes jit{0%,92%,100%{transform:none}93%{transform:translateX(2px) skewX(8deg)}95%{transform:translateX(-2px)}}

/* ===== Claude ===== */
#pg-claude.on{display:flex;height:100vh;overflow:hidden;background:#faf9f5;color:#3d3929;font-family:-apple-system,"Hiragino Sans",sans-serif}
.cl-side{width:270px;background:#f5f4ef;border-right:1px solid #e8e6dc;padding:12px;display:flex;flex-direction:column;font-size:14px;flex:none}
.cl-brand{font-family:Georgia,"Hiragino Mincho ProN",serif;font-size:22px;padding:6px 8px 16px}
.cl-side .it{padding:8px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-side .it:hover{background:#ebe9e0}
.cl-side .it.new{color:#c96442;font-weight:600}
.cl-side .it.lore{color:#8a5a3a;font-style:italic}
.cl-h{color:#8a8778;font-size:12px;padding:16px 10px 6px}
.cl-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px}
.cl-main{flex:1;display:flex;flex-direction:column;min-width:0}
.cl-scroll{flex:1;overflow-y:auto}
.cl-main.empty .cl-scroll{flex:0 0 auto}
.cl-wel{display:flex;align-items:center;justify-content:center;gap:14px;font-family:Georgia,"Hiragino Mincho ProN",serif;font-size:38px;padding:26vh 0 30px;font-weight:400;margin:0}
.cl-star{color:#d97757}
.cl-msgs{max-width:740px;margin:0 auto;padding:24px 24px 40px}
.cl-u{display:flex;gap:10px;align-items:flex-start;background:#f0eee6;border-radius:14px;padding:12px 16px;margin:20px 0;width:fit-content;max-width:85%;white-space:pre-wrap;line-height:1.6}
.cl-u .ua{width:26px;height:26px;border-radius:50%;background:#3d3929;color:#fff;display:grid;place-items:center;font-size:12px;flex:none}

<script>
'use strict';

/* #################################################################
   core.js
   ################################################################# */

/* =========================================================
   保存データ（再読み込みしても状態は消えない）
   ========================================================= */
const SAVE_KEY = 'yomi_save_v1';
const DEFAULT = {
  phase: 0,
  searches: 0,
  started: Date.now(),
  seals: {},
  installed: false,
  blackout: false,
  cleared: false,
  clearAt: 0,
  clearMs: 0,
  visits: 0,
  lastSeen: 0,
  flags: {},
  hist: [],
  posts: [],
  cg: [],
  cl: []
};
let S = loadSave();
function loadSave() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    return Object.assign(JSON.parse(JSON.stringify(DEFAULT)), d || {});
  } catch (e) {
    return JSON.parse(JSON.stringify(DEFAULT));
  }
}
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}
function resetGame() {
  localStorage.removeItem(SAVE_KEY);
  location.hash = '';
  location.reload();
}

/* =========================================================
   封印とヒント
   ========================================================= */

  ['paper', '紙'],

   ========================================================= */
let AC = null, DRONE = null;
function audio() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    AC.resume();
  } catch (e) {}
  return AC;
}
function tone(freqs, dur = 2, vol = 0.06, type = 'sine') {
  if (!AC) return;
  const t = AC.currentTime, g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  g.connect(AC.destination);
  freqs.forEach(f => {
    const o = AC.createOscillator();
    o.type = type;
    o.frequency.value = f;
    o.connect(g);
    o.start(t);
    o.stop(t + dur);
  });
}
function drone(on) {
  if (!AC) return;
  if (on && !DRONE) {
    const g = AC.createGain();
    g.gain.value = 0.035;
    g.connect(AC.destination);
    const os = [48, 51.3].map(f => {
      const o = AC.createOscillator();
      o.frequency.value = f;
      o.connect(g);
      o.start();
      return o;
    });
    DRONE = { g, os };
  } else if (!on && DRONE) {
    DRONE.os.forEach(o => o.stop());
    DRONE = null;
  }
}

let NOTIFS = [];
function notify({ app = 'Google Chrome', icon = '🔔', color = '#4285f4', fg = '#fff', title = '', body = '', time = '今', onclick, ttl = 7000, real = false }) {
  const n = h(`<div class="mnotif"><div class="ic" style="background:${color};color:${fg}">${icon}</div><div style="flex:1;min-width:0"><div class="ap">${esc(app)}</div><div class="tt">${esc(title)}<small>${time}</small></div><div class="bd">${body}</div></div></div>`);

  $('#ov').append(el);

  $('[data-c]', el).onclick = () => (closable ? close() : shake(el));
  $('.bar', el).addEventListener('mousedown', e => {
    if (e.target.tagName === 'I') return;
    const r = el.getBoundingClientRect();
    el.style.transform = 'none';
    el.style.left = r.left + 'px';
    el.style.top = r.top + 'px';
    const sx = e.clientX, sy = e.clientY;
    const mv = ev => {
      el.style.left = r.left + ev.clientX - sx + 'px';
      el.style.top = r.top + ev.clientY - sy + 'px';
    };
    const up = () => {
      removeEventListener('mousemove', mv);

    addEventListener('mousemove', mv);
    addEventListener('mouseup', up);
  });

}

function terminal(auto = true) {
  if ($('.term')) return;
  const w = win({ cls: 'term', title: `${USER} — -zsh — 80×24`, body: '<div class="tb"></div>' });
  const tb = $('.tb', w);
  const P = `${USER}@Mac ~ % `;

    tb.scrollTop = 1e6;
  };
  out(`Last login: ${new Date(Date.now() - 6 * 3600e3).toString().slice(0, 24)} on ttys000`);
  const prompt = () => {
    const ln = h(`<div class="ln"><span class="pr">${esc(P)}</span><input class="ti" spellcheck="false" autocomplete="off"></div>`);
    tb.append(ln);
    const i = $('.ti', ln);
    i.focus();
    tb.scrollTop = 1e6;
    i.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const c = i.value;
      i.replaceWith(document.createTextNode(c));
      const r = termCmd(c.trim(), w);
      if (r === null) return;
      if (r) out(r);
      prompt();
    });
  };
  (async () => {
    if (auto) {
      const script = [
        ['whoami', 'yomi'],
        ['sysctl -n machdep.cpu.brand_string', ENV.chip || 'Apple processor'],
        ['pmset -g batt', ` -InternalBattery-0\t${battPct() ?? '--'}%; ${ENV.battery && ENV.battery.charging ? 'charging' : 'discharging'}`],
        ['echo "うしろ"', 'うしろ']
      ];
      for (const [c, r] of script) {
        const ln = h(`<div class="ln"><span class="pr">${esc(P)}</span><span></span></div>`);
        tb.append(ln);
        const sp = ln.lastChild;
        await wait(800);
        for (const ch of c) {
          sp.textContent += ch;
          await wait(rand(40, 140));
        }
        await wait(300);
        out(r);
      }
    }
    prompt();
  })();
  return w;
}
function termCmd(c, w) {
  const a = c.split(/\s+/), cmd = a[0];
  const awake = S.installed && !S.cleared;
  const tb = $('.tb', w);
  if (!c) return '';
  if (cmd === 'exit') {
    tb.insertAdjacentHTML('beforeend', '<div>\n[プロセスが完了しました]</div>');
    setTimeout(() => w.remove(), 900);
    return null;
  }
  if (cmd === 'clear') { tb.innerHTML = ''; return ''; }
  if (cmd === 'help') return 'whoami ls cat cd ps top kill sudo date uname sysctl pmset echo say open clear exit';
  if (cmd === 'whoami') return awake ? 'yomi' : USER;
  if (cmd === 'date') return new Date().toString();
  if (cmd === 'echo') return a.slice(1).join(' ').replace(/^["']|["']$/g, '');
  if (cmd === 'uname') return `Darwin Mac 24.0.0 Darwin Kernel ${ENV.chip.startsWith('Apple') ? 'arm64' : 'x86_64'}`;
  if (cmd === 'sysctl') return `machdep.cpu.brand_string: ${ENV.chip || 'Apple processor'}\nhw.ncpu: ${ENV.cores}\nhw.memsize: ${ENV.mem}+ GB`;
  if (cmd === 'pmset') {
    if (a.includes('sleepnow')) return awake ? 'pmset: 岩を落とすのは、あなたの手で。' : 'Sleeping now...';
    return ` -InternalBattery-0\t${battPct() ?? '--'}%; ${ENV.battery && ENV.battery.charging ? 'charging' : 'discharging'}`;
  }
  if (cmd === 'ls') {
    if (/down/i.test(a[1] || '')) return S.flags.dl ? 'yomid_receipt.txt' : '';
    return 'Applications  Desktop  Documents  Downloads  Library  Movies  Music  Pictures' + (awake ? '  yomi' : '');
  }
  if (cmd === 'cat') {
    if (/receipt/.test(c)) return 'cat: Downloads/yomid_receipt.txt: Permission denied\nyomid: それは、あなたの手で開いて。';
    if (/yomi/.test(c)) return 'cat: yomi: Is a directory\n……のぞかないで';
    return `cat: ${a[1] || ''}: No such file or directory`;
  }
  if (cmd === 'cd') return /yomi/.test(c) ? 'cd: permission denied: yomi' : '';
  if (cmd === 'ps' || cmd === 'top') {
    return `  PID  %CPU COMMAND\n    1   0.1 launchd\n  412   2.3 WindowServer\n  598   8.7 Google Chrome\n${awake ? '  666  66.6 yomid\n' : ''}  801   0.4 zsh`;
  }
  if (cmd === 'kill' || cmd === 'killall') {
    if (awake && /666|yomi/.test(c)) return 'kill: 666: Operation not permitted\nyomid: 殺しても、帰らない。\nyomid: 帰り道は、門と、岩。';
    return `kill: illegal process id: ${a[1] || ''}`;
  }
  if (cmd === 'sudo') return awake ? 'Password:\nsudo: あなたは、わたしではありません。' : 'Password:\nSorry, try again.';
  if (cmd === 'rm') return 'rm: やめて。';
  if (cmd === 'open') return 'open: 開けるのは、かんたん。閉じるのは、むずかしい。';
  if (/networksetup|airport/.test(cmd)) return '糸は、あなたの指で切って。';
  if (cmd === 'say') {
    try { speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(a.slice(1).join(' ') || 'うしろ'), { lang: 'ja-JP' })); } catch (e) {}
    return '';
  }
  return `zsh: command not found: ${cmd}`;
}

const SWALLOW = ['keydown', 'keyup', 'keypress', 'contextmenu', 'wheel'];
function swallow(e) {
  e.preventDefault();

}
async function say(L, t, ms = 2600) {
  let b = $('.bt', L);
  if (!b) {
    b = h('<div class="bt"></div>');
    L.append(b);
  }
  b.textContent = t;
  void b.offsetWidth;
  b.style.opacity = 1;
  await wait(ms);
  b.style.opacity = 0;
  await wait(1100);
}
async function blackout({ pre = 4000, lines = [], hold = 4000, boot = true, chime = true } = {}) {
  S.blackout = true;
  save();
  BUSY = true;
  const L = h('<div class="blk-ov"><div class="bt"></div></div>');
  document.body.append(L);
  SWALLOW.forEach(t => addEventListener(t, swallow, { capture: true, passive: false }));
  drone(true);
  await wait(pre);
  for (const t of lines) await say(L, t, 2800);
  await wait(hold);
  drone(false);
  if (boot) await bootSeq(L, chime);
  SWALLOW.forEach(t => removeEventListener(t, swallow, { capture: true }));
  L.style.transition = 'opacity 1.2s';
  L.style.opacity = 0;
  await wait(1200);
  L.remove();
  S.blackout = false;
  save();
  BUSY = false;
}

function aiMd(lines) {
  const arr = Array.isArray(lines) ? lines : String(lines).split('\n');
  const inl = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
  let out = '', list = null;
  const close = () => {
    if (list) {
      out += `</${list}>`;
      list = null;
    }
  };
  arr.forEach(ln => {
    let m;
    if ((m = ln.match(/^- (.*)/))) {
      if (list !== 'ul') {
        close();
        out += '<ul>';
        list = 'ul';
      }
      out += `<li>${inl(m[1])}</li>`;
    } else if ((m = ln.match(/^\d+\. (.*)/))) {
      if (list !== 'ol') {
        close();
        out += '<ol>';
        list = 'ol';
      }
      out += `<li>${inl(m[1])}</li>`;
    } else {
      close();
      if (!ln.trim()) return;
      out += ln.startsWith('<') ? ln : `<p>${inl(ln)}</p>`;
    }
  });
  close();
  return out;
}

async function aiSend(b, text) {
  const st = AI[b];
  text = String(text || '').trim();
  if (!text || st.busy) return;
  audio();
  AI_LAST = Date.now();
  let el = $('#pg-' + st.page);
  if (el.dataset.view === 'lore') {
    go(st.page);
    el = $('#pg-' + st.page);
  }
  const m = { r: 'u', t: text };
  S[b].push(m);
  if (S[b].length > 120) S[b].splice(0, S[b].length - 120);
  save();
  aiUnEmpty(b, el);
  if (S[b].filter(x => x.r === 'u').length === 1) {
    const hh = $(b === 'cg' ? '.cg-h' : '.cl-h', el);
    if (hh) hh.insertAdjacentHTML('afterend', `<div class="it" data-cmain>${esc(text.slice(0, 24))}</div>`);
  }
  aiBox(b, el).append(aiMsgEl(b, m));
  await aiRespond(b, el, text);
}
async function aiStream(node, html, sc) {
  const tk = html.match(/<[^>]+>|&[a-z#0-9]+;|[\s\S]/gi) || [];
  let buf = '';
  for (let i = 0; i < tk.length; i++) {
    buf += tk[i];
    if (i % 4 === 0 || i === tk.length - 1) {
      node.innerHTML = buf;
      if (sc) sc.scrollTop = sc.scrollHeight;
      await wait(14);
      if (!node.isConnected) return;
    }
  }
  node.innerHTML = html;
}
async function aiGlitch(body) {
  await wait(rand(1500, 4000));
  if (!body.isConnected) return;
  const ps = $$('p,li', body);
  if (!ps.length) return;
  const p = pick(ps), o = p.innerHTML;
  p.innerHTML = `<span class="gl">${pick(['うしろ', 'みてるよ', 'ここはあたたかい', 'かえりたくない'])}</span>`;
  await wait(700);
  p.innerHTML = o;
}
async function aiRespond(b, el, text) {
  const st = AI[b], cg = b === 'cg';
  st.busy = true;
  aiSendState(b);
  const box = aiBox(b, el), sc = aiScroller(b, el);
  const th = cg
    ? h(`<div class="cg-think">${AWK() && Math.random() < 0.25 ? 'みてる…' : '考え中…'}</div>`)
    : h('<div class="cl-spin">✳︎</div>');
  box.append(th);
  sc.scrollTop = sc.scrollHeight;
  const t0 = Date.now();
  let res;
  try {
    res = await aiAnswer(b, text);
  } catch (e) {
    res = { h: aiMd(['すみません、応答の生成中にエラーが発生しました。もう一度お試しください。']) };
  }
  const ms = res.ms != null ? res.ms : (res.think ? res.think * 1000 : rand(700, 1500));
  if (cg && res.think) {
    setTimeout(() => { if (th.isConnected) th.textContent = AWK() ? '推論しています…（みられています）' : '推論しています…'; }, 1500);
  }
  await wait(Math.max(0, ms - (Date.now() - t0)));
  th.remove();
  const m = { r: 'a', h: res.h, think: cg ? (res.think || 0) : 0 };
  S[b].push(m);
  save();
  const node = aiMsgEl(b, m);
  const body = $('.body', node);
  const full = body.innerHTML;
  body.innerHTML = '';
  box.append(node);
  await aiStream(body, full, sc);
  st.busy = false;
  aiSendState(b);
  if (res.after) res.after();
  if (cg && res.glitch !== false && AWK() && Math.random() < 0.18) aiGlitch(body);
}
async function aiRegen(b) {
  const st = AI[b];
  const el = $('#pg-' + st.page);
  if (st.busy || el.dataset.view === 'lore') return;
  const arr = S[b];
  if (!arr.length || arr[arr.length - 1].r !== 'a') return;
  arr.pop();
  const lu = [...arr].reverse().find(m => m.r === 'u');
  save();
  const last = $$(b === 'cg' ? '.cg-a' : '.cl-a', el).pop();
  if (last) last.remove();
  if (lu) await aiRespond(b, el, lu.t);
}

    return aiMd([`**${esc(hit.title)}** について、要点をまとめます。`, esc(ss[0]), ...ss.slice(1).map(x => '- ' + esc(x)), 'さらに詳しく知りたい点があれば、遠慮なく聞いてください。']);
  }
  return aiMd([esc(ss.slice(0, 2).join('')), ss.length > 2 ? esc(ss.slice(2).join('')) : '', aiNote(`ウィキペディア「${esc(hit.title)}」の記事をもとにしています。気になるところがあれば、もう少し掘り下げましょう。`)]);
}

/* =========================================================

    if (/ほんもの|本物|にせもの|偽物|なかのひと|中の人/.test(k)) {

/* =========================================================

const WP = 'https://ja.wikipedia.org/w/api.php';
const CM = 'https://commons.wikimedia.org/w/api.php';
const CACHE = new Map();
async function wapi(params, base = WP) {
  const u = new URL(base);
  const p = Object.assign({ format: 'json', origin: '*', formatversion: '2' }, params);
  Object.keys(p).forEach(k => u.searchParams.set(k, p[k]));
  const key = u.toString();
  if (CACHE.has(key)) return CACHE.get(key);
  const r = await fetch(key);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  CACHE.set(key, d);
  return d;
}

const censorOn = () => AWK() && !S.seals.gate;
function censor(html) {

function censorDom(root) {
  if (!censorOn()) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const hits = [];
  while (w.nextNode()) {
    GOD_RE.lastIndex = 0;
    if (GOD_RE.test(w.currentNode.nodeValue)) hits.push(w.currentNode);
  }
  hits.forEach(n => {
    const s = document.createElement('span');
    s.innerHTML = esc(n.nodeValue).replace(GOD_RE, CENS);
    n.replaceWith(s);
  });
}

function suggestions(v) {
  const vv = v.trim();
  const hist = [...new Set(S.hist.map(x => x.q))]
    .filter(x => !vv || x.startsWith(vv))
    .slice(0, vv ? 3 : 6)
    .map(t => ({ t, h: 1 }));
  const base = vv ? SUG_TAIL.map(s => ({ t: vv + s })) : [];
  const out = [...hist, ...base].slice(0, 8);
  if (AWK() && Math.random() < 0.6) out.splice(rand(0, out.length), 0, { t: pick(CREEP_SUG), c: 1 });
  else if (S.phase === 1 && Math.random() < 0.15) out.push({ t: vv ? vv + ' うしろ' : 'うしろ', c: 1 });
  return out;
}
function bindSbox(root) {
  const f = $('.sbox', root);
  const i = $('input', f);
  const sg = $('.sugg', f);
  let sel = -1;
  const hide = () => {
    sg.classList.remove('on');
    f.classList.remove('open');
    sel = -1;
  };
  const show = () => {
    if (document.activeElement !== i) return hide();
    const list = suggestions(i.value);
    if (!list.length) return hide();
    sg.innerHTML = '<div class="sep"></div>' + list.map(x =>
      `<div class="it ${x.c ? 'creep' : ''}" data-t="${esc(x.t)}">${x.h ? IC.clock : IC.search}<span>${esc(x.t)}</span></div>`
    ).join('');
    sg.classList.add('on');
    f.classList.add('open');
    $$('.it', sg).forEach(it => {
      it.onmousedown = e => {
        e.preventDefault();
        doSearch(it.dataset.t);
      };
    });
  };
  i.addEventListener('input', () => {
    f.classList.toggle('has', !!i.value);
    show();
  });
  i.addEventListener('focus', () => {
    f.classList.add('focus');
    show();
  });
  i.addEventListener('blur', () => {
    f.classList.remove('focus');
    setTimeout(hide, 120);
  });
  i.addEventListener('keydown', e => {
    const its = $$('.it', sg);
    if (!its.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + its.length) % its.length;
      its.forEach((x, j) => x.classList.toggle('sel', j === sel));
      i.value = its[sel].dataset.t;
    } else if (e.key === 'Escape') hide();
  });
  f.onsubmit = e => {
    e.preventDefault();
    doSearch(i.value);
  };
  $('.clr', f).onclick = () => {
    i.value = '';
    f.classList.remove('has');
    i.focus();
  };
}

  }

async function runAio(box, q, k, hits, tok, meta) {
  if (meta.late) {

    await wait(1400);

    box.style.display = '';
  }
  box.innerHTML = AIO_HEAD + AIO_GEN;
  let c = null;
  try {
    c = await aioContent(q, k, hits);
  } catch (e) {}
  await wait(meta.slow);
  if (tok !== RTOK || !box.isConnected) return;
  if (!c) {
    box.innerHTML = AIO_HEAD + '<div class="gen">現在、この検索では AI による概要を利用できません。</div>';
    return;
  }
  box.innerHTML = `${AIO_HEAD}<div class="txt ${c.long ? 'clip' : ''}">${c.html}</div>${c.srcs ? `<div class="srcs">${c.srcs.map(t => `<a data-wiki="${esc(t)}">${censor(esc(t))} - Wikipedia</a>`).join('')}</div>` : ''}${c.long ? '<button class="more">もっと見る</button>' : ''}<div class="disc">AI による回答には間違いが含まれている場合があります。</div>`;
  const more = $('.more', box);

  if (AWK() && c.srcs && Math.random() < 0.35) {
    await wait(7000);
    if (tok !== RTOK || !box.isConnected) return;
    $('.txt', box).insertAdjacentHTML('beforeend', `<p class="gl">${pick([`……「${esc(q)}」よりも、うしろを気にしたほうがいい。`, '……この回答、わたしが書きました。', '……ねえ、まだ読んでるの？'])}</p>`);
  } else if (S.phase === 1 && c.srcs && Math.random() < 0.15) {
    await wait(5000);

    if (!li) return;
    const o = li.innerHTML;
    li.innerHTML = '<span style="color:#b00">うしろ</span>';

  }
}

    }

    return `<div class="x-tabs"><div class="on">ポスト</div><div>返信</div><div>メディア</div><div>いいね</div></div><div style="padding:16px;border-bottom:1px solid #eff3f4"><div class="x-av" style="background:#7b1fa2;width:80px;height:80px;font-size:32px">あ</div><div style="font-size:20px;font-weight:700;margin-top:10px">あなた</div><div style="color:#536471">@you</div><div style="color:#536471;margin-top:8px;font-size:14px">${ph === 2 ? 'フォロー 1 · <span style="color:#900">フォロワー 1（yomi）</span>' : 'フォロー 0 · フォロワー 0'}</div></div>${mine.length ? mine.map(xPost).join('') : '<div class="x-empty">まだポストがありません</div>'}`;
  }
  const list = [...myPosts(), ...feed()];
  return `<div class="x-tabs"><div class="on">おすすめ</div><div>フォロー中</div></div>
    <div class="x-comp"><div class="x-av" style="background:#7b1fa2">あ</div><div style="flex:1"><textarea rows="2" placeholder="いまどうしてる？"></textarea><div class="row"><span>🖼️ 🎞️ 📊 😊 📅 📍</span><button disabled>ポストする</button></div></div></div>
    ${list.map(xPost).join('')}`;
}
function xSide() {
  return `<div class="x-srch">🔍<input placeholder="検索"></div>
    <div class="x-box"><h3>いまどうしてる？</h3>${xTrends().slice(0, 5).map(([s, b, c, cr]) => `<div class="x-tr ${cr ? 'creep' : ''}" data-tr="${esc(b)}"><small>${s}</small><b>${esc(b)}</b><small>${c}</small></div>`).join('')}</div>
    <div class="x-box"><h3>おすすめユーザー</h3>${[['Google', '@Google', '#4285f4'], ['OpenAI', '@OpenAI', '#111'], ['Anthropic', '@AnthropicAI', '#d97757']].map(([n, u, c]) => `<div class="x-fo"><div class="x-av" style="background:${c}">${n[0]}</div><div><b>${n}</b><small>${u}</small></div><button data-fol="${u}">${XFOL[u] ? 'フォロー中' : 'フォロー'}</button></div>`).join('')}</div>
    <div style="color:#536471;font-size:13px;padding:16px;line-height:1.8">利用規約 · プライバシーポリシー · Cookie のポリシー<br>© 2026 X Corp.</div>`;
}
function xReply(p) {
  const t = p.t;
  let rep;
  if (AWK()) {
    rep = { n: 'yomi', u: '@yomi_______', c: '#000', creep: 1, t: /たすけ|助け|help/i.test(t) ? 'だれも、こないよ' : /よみ|ヨミ|yomi/i.test(t) ? 'よんだ？' : /こわ|怖/.test(t) ? 'こわくないよ。あたたかいよ。' : pick(['みてるよ', 'うしろ', 'その投稿、わたしにも見えてる', 'ねえ、こっちむいて']) };
  } else if (S.cleared) {
    rep = { n: 'しの', u: '@shino_s', c: '#d62828', t: pick(['おつかれさま！', 'わかる、こわかったよね', 'またね、って言われた？']) };
  } else if (Math.random() < 0.4) {
    rep = { n: 'ねこ部長', u: '@nekobuchou', c: '#f4a261', t: pick(['わかる', 'それな', '😂']) };
  }
  if (!rep) return;
  setTimeout(() => {
    rep.at = Date.now();
    p.rep.push(rep);
    save();
    notify({ app: 'X', icon: '𝕏', color: '#000', title: `${rep.n} さんが返信しました`, body: esc(rep.t) });
    if (CUR === 'x') go('x', history.state && history.state.arg, false);
  }, rand(3500, 7000));
}
R.x = (el, arg = '') => {
  const view = arg.startsWith('s:') ? 'search' : (arg || 'home');
  const q = view === 'search' ? arg.slice(2) : '';
  setTitle(view === 'search' ? `${q} - 検索 / X` : { home: 'ホーム / X', explore: '話題を検索 / X', notif: '通知 / X', msg: 'メッセージ / X', me: 'あなた (@you) / X' }[view] || 'X');
  if (S.cleared && !S.flags.xpost) {
    S.flags.xpost = 1;
    S.posts.unshift({ id: 'm' + S.clearAt, t: `門を閉じました。\n所要時間 ${fmtDur(S.clearMs)}・検索 ${S.searches} 回\n#ヨミを帰した`, at: S.clearAt, l: 0, rep: [] });
    save();
  }
  const NAV = [['home', '🏠', 'ホーム'], ['explore', '🔍', '話題を検索'], ['notif', '🔔', '通知' + (xPhase() === 2 ? ' (3)' : '')], ['msg', '✉️', 'メッセージ'], ['me', '👤', 'プロフィール']];
  el.innerHTML = `<div class="x-wrap">
    <nav class="x-nav">
      <a data-xv="home" style="font-size:30px">𝕏</a>
      ${NAV.map(([v, i, n]) => `<a data-xv="${v}" class="${view === v ? 'on' : ''}">${i}<span>${n}</span></a>`).join('')}
      <a data-act="home">🔙<span>Google に戻る</span></a>
      <button class="pb" data-xv="home">ポストする</button>
      <div class="x-me"><div class="x-av" style="background:#7b1fa2">あ</div><div><b>あなた</b><small>@you</small></div></div>
    </nav>
    <main class="x-main">${xMain(view, q)}</main>
    <aside class="x-side">${xSide()}</aside>
  </div>`;
  const ta = $('.x-comp textarea', el), btn = $('.x-comp button', el);
  if (ta) {
    ta.oninput = () => { btn.disabled = !ta.value.trim(); };
    btn.onclick = () => {
      const p = { id: 'm' + Date.now(), t: ta.value.trim(), at: Date.now(), l: 0, rep: [] };
      S.posts.unshift(p);
      save();
      xReply(p);
      go('x', '', false);
    };
  }
  const si = $('.x-srch input', el);
  si.onkeydown = e => {
    if (e.key === 'Enter' && si.value.trim()) go('x', 's:' + si.value.trim());
  };
  el.onclick = e => {
    const t = e.target.closest('[data-xv],[data-tr],[data-xq],[data-like],[data-rt],[data-fol]');
    if (!t) return;
    const d = t.dataset;
    if (d.xv) go('x', d.xv === 'home' ? '' : d.xv);
    else if (d.tr) go('x', 's:' + d.tr);
    else if (d.xq) go('x', 's:' + d.xq);
    else if (d.like) {
      XLIKE[d.like] = !XLIKE[d.like];
      go('x', arg, false);
    } else if (d.rt) {
      XRT[d.rt] = !XRT[d.rt];
      go('x', arg, false);
    } else if (d.fol) {
      XFOL[d.fol] = !XFOL[d.fol];
      t.textContent = XFOL[d.fol] ? 'フォロー中' : 'フォロー';
    }
  };
};
